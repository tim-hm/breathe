# Formatting and linting only — the fast, dependency-free slice of the gate.
# Tests, the SQLx cache check, and the generated-Swift drift check stay local
# (`mise run check`) until CI grows a database and BSR access.
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check:proto's breaking-change check diffs against `main`'s history,
          # which a shallow clone doesn't carry.
          fetch-depth: 0
      # A pull_request checkout is a detached HEAD with no local `main`, and
      # check:proto deliberately fails closed when `main` doesn't resolve.
      - run: git rev-parse --verify --quiet main || git fetch origin main:main
      - uses: jdx/mise-action@v2
      - run: mise run check:rs
      # The önd rename moves the proto package from `breathe.v1` to `ond.v1`,
      # which is a breaking change on purpose and by definition. Defensible only
      # because no client has shipped. Remove this `env:` in the first PR after
      # the rename lands — with it in place the breaking-change gate reports but
      # never fails, and a real break would sail through unnoticed.
      - run: mise run check:proto
        env:
          PROTO_BREAKING_ACK: >-
            renaming the contract package breathe.v1 to ond.v1 with the app; nothing has shipped, so no client pins the old paths
      - run: mise run check:text
      - run: mise run check:md
      - run: mise run check:doc-links

  lint-swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          # Only the two tools check:swift runs — skips the Rust toolchain and
          # cargo tools, which cost real minutes on the 10x-billed macOS runner.
          install_args: swiftformat swiftlint
      - run: mise run check:swift
        env:
          # Without this, `mise run` auto-installs every tool in .mise.toml,
          # defeating the selective install above.
          MISE_AUTO_INSTALL: "false"
