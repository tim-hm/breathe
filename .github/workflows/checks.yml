# Formatting, linting, and the one drift check that needs no database — the fast
# slice of the gate. Tests, the SQLx cache check, and the generated-Swift drift
# check stay local (`mise run check`) until CI grows a database and BSR access.
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check:proto's breaking-change check diffs against `main`'s history,
          # which a shallow clone doesn't carry.
          fetch-depth: 0
      # A pull_request checkout is a detached HEAD with no local `main`, and
      # check:proto deliberately fails closed when `main` doesn't resolve.
      - run: git rev-parse --verify --quiet main || git fetch origin main:main
      - uses: jdx/mise-action@v2
      - run: mise run check:rs
      - run: mise run check:proto
      - run: mise run check:text
      - run: mise run check:md
      - run: mise run check:doc-links

  lint-swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          # Only the tools these two tasks run — skips the Rust toolchain and
          # cargo tools, which cost real minutes on the 10x-billed macOS runner.
          # `vp` is here because check:diagrams formats the HTML it writes; the
          # Swift compiler comes from the runner's Xcode, not from mise.
          install_args: swiftformat swiftlint vp
      - run: mise run check:swift
        env:
          # Without this, `mise run` auto-installs every tool in .mise.toml,
          # defeating the selective install above.
          MISE_AUTO_INSTALL: "false"
      # The only automatic check that the marketing site's figures still match
      # the geometry the apps draw. It needs a Swift toolchain, which is why it
      # rides this job rather than the Linux one and cannot join `mise run check`.
      - run: mise run check:diagrams
        env:
          MISE_AUTO_INSTALL: "false"
