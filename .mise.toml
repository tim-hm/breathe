# The single entry point for every repo operation. See CLAUDE.md §3: run things
# through `mise run <task>`, never the raw `cargo`/`buf`/`sqlx` equivalent — the
# tasks encode the env (SQLX_OFFLINE, DATABASE_URL, CARGO_TARGET_DIR) that those
# commands need to behave the same way here, in a fresh clone, and in CI
# (.github/workflows/checks.yml, which runs the lint/format subset).

# Tools ride `latest` on purpose — a deliberate nudge to keep the toolchain
# current. The exceptions are pinned because something committed depends on the
# exact version.
[tools]
# Must precede the cargo:* entries so mise's cargo backend installs prebuilt
# binaries instead of compiling each tool from source.
cargo-binstall = "latest"

# Kept in lockstep with Cargo.toml's `rust-version`. A dependency can raise the
# real floor without declaring it, and then only a fresh clone finds out.
#
# The components are load-bearing: mise installs Rust through rustup, and a
# toolchain it installs itself carries neither rustfmt nor clippy, so `check:rs`
# dies with "'cargo-fmt' is not installed for the toolchain". A machine that
# already has its own rustup never sees this — mise adopts that installation,
# components and all — which is why this only ever failed on CI.
rust = { version = "1.96", components = ["rustfmt", "clippy"] }

buf = "latest"
# Load-bearing despite buf handling Swift generation: crates/api/build.rs runs
# prost-build, which needs a `protoc` binary from the environment (nothing in
# the dependency tree vendors one).
protoc = "latest"
lychee = "latest"
"npm:markdownlint-cli2" = "0.23.2"
# Vite+'s formatter (oxfmt), the same tool `connect` formats with. Pinned for the
# same reason markdownlint-cli2 is: its output is committed, so a version bump
# reformats the tree and fails `check` for everyone who has not bumped yet.
vp = "0.2.8"
# Backs `web:serve` (`pnpm dlx serve`). pnpm, not npm, is the package runner of
# choice for JS tooling here.
pnpm = "latest"

"cargo:cargo-nextest" = "latest"
"cargo:cargo-watch" = "latest"
# Reports crate dependencies nothing imports. Backs `check:deps`.
"cargo:cargo-machete" = "latest"
# Matches Cargo.lock against the RustSec advisory database. Backs `check:audit`.
"cargo:cargo-audit" = "latest"
# Pinned to 0.9.x to match the `sqlx` crate: the CLI validates the committed
# .sqlx offline cache, and a 0.8 CLI cannot read a 0.9 cache. Move both together.
"cargo:sqlx-cli" = "0.9"

# iOS toolchain. Xcode itself is not installable by mise — docs/contributing.md
# covers that step. `os` keeps CI's Linux runner from failing on tools that only
# ship macOS builds.
xcodegen = { version = "latest", os = ["macos"] }
swiftlint = { version = "latest", os = ["macos"] }
swiftformat = { version = "latest", os = ["macos"] }

# Backs the infra:* tasks. OpenTofu, not Terraform — see infra/versions.tf.
opentofu = "latest"

[env]
# The one secret this repo takes, and the only reason a dotenv file exists here
# at all: OPENROUTER_API_KEY, the assistant's provider key. `.env` is gitignored
# and optional — absent, the API boots with the assistant answering from its
# rule-based fallback, which is what CI and a fresh clone get. `redact` keeps
# the value out of `mise env` and task output; nothing else should ever print
# it.
_.file = { path = ".env", redact = true }

# Global so every cargo invocation reads the committed .sqlx cache rather than
# needing a live database. `generate:sqlx` overrides it, because refreshing the
# cache is precisely the operation that must talk to a real server.
SQLX_OFFLINE = "true"
# Port rationale lives in compose.yaml. In short: önd owns 18100–18199, and
# a shell that has visited the sibling `connect` repo exports a DATABASE_URL
# pointing at *its* cluster — so every task here supplies its own rather than
# inheriting whatever the shell happens to hold.
DATABASE_URL = "postgres://postgres:postgres@localhost:18101/ond?sslmode=disable"

# Every non-`dev` cargo invocation builds here instead of ./target. The reason is
# the cargo *file lock*, not artifact invalidation: `clippy` and `build` write
# distinct fingerprints and coexist happily, but they cannot hold the lock at the
# same time — so without the split, running `check` blocks the `dev` watch loop
# (and vice versa) until one finishes.
CHECK_TARGET_DIR = "{{config_root}}/target/check"

# dev: the local loop

[tasks."dev:db"]
description = "Start PostgreSQL in the background"
run = "docker compose up -d --wait db"

[tasks."dev:db:stop"]
description = "Stop PostgreSQL"
run = "docker compose down"

[tasks."dev:db:reset"]
description = "Destroy the database volume and rebuild it from migrations"
run = ["docker compose down -v", "mise run dev:db", "mise run migrate"]

[tasks.dev]
description = "Run the API with auto-reload on change"
depends = ["dev:db"]
# Scoped to the directories the binary is actually built from. Unscoped,
# `cargo watch` watches everything git tracks — so editing a SwiftUI view or a
# doc would relink and restart the API.
run = "cargo watch -w crates -w proto -x 'run -p api'"

[tasks.migrate]
description = "Create the database if absent, apply migrations, seed reference data"
depends = ["dev:db"]
run = "cargo run -p migrate"

[tasks."db:psql"]
description = "Query the local database (SQL on stdin)"
run = "docker compose exec -T db psql -U postgres -d ond"

[tasks."dev:coach"]
description = "Grant Coach to a local user for a year (arg: user id, or the newest user)"
depends = ["dev:db"]
# Writes what a real App Store purchase would have. A simulator purchase cannot
# — docs/contributing.md explains why under things that will bite you.
#
# Both columns together: `users_subscription_is_whole` requires the tier and the
# expiry to be set or absent as a pair.
usage = 'arg "[user]" help="The user id to grant. Defaults to the most recently created user."'
run = """
set -e
# `-q` so a command tag ("UPDATE 0") stays out of the captured output below.
db() { docker compose exec -T db psql -qv ON_ERROR_STOP=1 -U postgres -d ond "$@"; }

id="${usage_user:-}"
if [ -z "$id" ]; then
  id=$(db -tAc 'select id from users order by created_at desc limit 1')
  if [ -z "$id" ]; then
    echo "no users yet — open the app once so it creates one" >&2
    exit 1
  fi
  echo "no user id given, using the newest: $id"
fi

# `returning` rather than trusting the exit status: psql reports UPDATE 0 as a
# success, so a typo'd id would otherwise look exactly like a granted one — and
# this task exists for the case where the coach already appears broken.
granted=$(db -tAc "update users set subscription_tier = 'COACH', \
  subscription_until = now() + interval '1 year' where id = '$id' returning id;")
if [ -z "$granted" ]; then
  echo "no user with id $id" >&2
  exit 1
fi
echo "granted Coach to $granted for a year"
"""

[tasks."build:release"]
description = "Build the API release binary (what a deployment ships)"
env = { CARGO_TARGET_DIR = "{{env.CHECK_TARGET_DIR}}" }
run = "cargo build --release -p api"

# generate: everything derived from a source of truth elsewhere

[tasks.generate]
description = "Regenerate protobuf types and the SQLx offline cache"
run = ["mise run generate:proto", "mise run generate:sqlx"]

[tasks."generate:proto"]
description = "Generate Swift client code from proto/ (Rust generates in build.rs)"
dir = "{{config_root}}/proto"
run = "buf generate"

[tasks."generate:sqlx"]
description = "Refresh the committed .sqlx offline query cache"
depends = ["dev:db"]
# Must compile against a live database: `cargo sqlx prepare` discovers queries by
# type-checking them against the real server, which is the whole point of the cache.
env = { SQLX_OFFLINE = "false", CARGO_TARGET_DIR = "{{env.CHECK_TARGET_DIR}}" }
run = "cargo sqlx prepare --workspace -- --all-targets"

# fmt / fix: mutating

[tasks.fmt]
description = "Format everything"
run = ["mise run fmt:rs", "mise run fmt:swift", "mise run fmt:text"]

[tasks."fmt:rs"]
run = "cargo fmt"

[tasks."fmt:swift"]
run = "swiftformat ios --config ios/.swiftformat"

[tasks."fmt:text"]
description = "Format everything that is not Rust or Swift (markdown, YAML, JSON, TOML)"
# vp is Vite+'s formatter, the same one `connect` uses. Markdown is what we were
# missing; getting YAML and TOML with it is the reason there is one task here
# rather than three tools.
#
# `proseWrap: "never"` in vite.config.ts is the load-bearing setting: a paragraph
# is one physical line and the reader's editor decides where it breaks. The
# `printWidth` beside it is not a line limit — see the comment there for what it
# actually decides.
#
# vp refuses to run outside a JS workspace, which is the only reason the root
# package.json exists — it declares no dependencies and installs nothing. The
# vite.config.ts next to it is vp's config file, not a Vite app; it deliberately
# omits the `defineConfig` import `vp fmt --init` generates, because resolving it
# would mean installing an npm dependency tree to configure a formatter.
run = "vp fmt"

[tasks.fix]
description = "Auto-fix formatting and the lint findings that are mechanically fixable"
env = { CARGO_TARGET_DIR = "{{env.CHECK_TARGET_DIR}}" }
run = [
  "cargo clippy --workspace --all-targets --fix --allow-dirty --allow-staged",
  "mise run fmt",
  "swiftlint --fix --config ios/.swiftlint.yml ios",
  # After `fmt`, so the linter's fixes land on already-formatted markdown rather
  # than being reflowed out from under it.
  "markdownlint-cli2 --fix",
]

# check: validation. `check` is the gate — it is what must pass. Read-only with
# one exception: check:generated regenerates the committed Swift in place before
# diffing, so a dirty Generated/ directory gets rewritten.

[tasks.check]
description = "Full validation (the gate)"
# The Rust tasks share one cargo artifact lock, so running them concurrently just
# stalls on "Blocking waiting for file lock" — they are serialised in `run` while
# everything genuinely independent fans out through `depends`.
depends = ["check:proto", "check:generated", "check:text", "check:md", "check:doc-links", "check:deps"]
run = ["mise run check:rs", "mise run check:sqlx", "mise run test:rs", "mise run test:e2e"]

[tasks."check:rs"]
description = "Validate Rust (fmt + clippy)"
env = { CARGO_TARGET_DIR = "{{env.CHECK_TARGET_DIR}}" }
run = ["cargo fmt -- --check", "cargo clippy --workspace --all-targets -- -D warnings"]

[tasks."check:sqlx"]
description = "Assert the committed .sqlx cache matches the queries in the tree"
env = { CARGO_TARGET_DIR = "{{env.CHECK_TARGET_DIR}}" }
run = "cargo sqlx prepare --workspace --check -- --all-targets"

[tasks."check:proto"]
description = "Lint the protobuf contract and check it for breaking changes against main"
dir = "{{config_root}}/proto"
# An unresolvable `main` fails closed rather than skipping: a skip-on-missing
# branch would also skip on a detached-HEAD CI checkout, a shallow clone, or a
# fork — exactly the places the breaking-change check matters most.
#
# PROTO_BREAKING_ACK is the escape hatch for a commit that breaks the contract on
# purpose, which is only defensible while no client has shipped (M2's stage model
# was the first and, if V1 goes to the App Store on schedule, the last). It is
# opt-in per invocation, so the default stays fail-closed; it still runs the
# check and prints every finding, so nothing is hidden from review; and it
# demands a sentence rather than a boolean, so the reason travels with the run.
# The break stops being one the moment the commit reaches `main`, which is what
# makes a per-invocation variable the right shape instead of a config entry.
run = ["buf lint", """
  if ! git -C .. rev-parse --verify --quiet main >/dev/null; then
    echo 'check:proto: cannot resolve `main`, refusing to skip the breaking-change check' >&2
    exit 1
  fi

  if [ -n "${PROTO_BREAKING_ACK:-}" ]; then
    echo "check:proto: breaking changes acknowledged — ${PROTO_BREAKING_ACK}" >&2
    buf breaking --against '../.git#branch=main,subdir=proto' || true
    exit 0
  fi

  buf breaking --against '../.git#branch=main,subdir=proto'
  """]

[tasks."check:swift"]
description = "Validate Swift (format + lint)"
run = ["swiftformat --lint ios --config ios/.swiftformat", "swiftlint lint --strict --config ios/.swiftlint.yml ios"]

[tasks."check:text"]
description = "Assert markdown, YAML, JSON, and TOML are formatted"
run = "vp fmt --check"

[tasks."check:md"]
description = "Lint markdown rules a formatter has no opinion about"
# Separate from check:text because the scopes genuinely differ: vp owns
# whitespace and table shape across four formats, markdownlint owns heading
# levels, link style, and bare URLs in markdown alone.
run = "markdownlint-cli2"

[tasks."check:doc-links"]
description = "Resolve every link in the docs without hitting the network"
run = "lychee --offline --root-dir {{config_root}} 'docs/**/*.md' CLAUDE.md README.md"

[tasks."check:generated"]
description = "Assert the committed Swift protobuf matches proto/"
# The same contract check:sqlx applies to the other committed generated artifact:
# regenerate, compare, fail on drift. Needed because the Xcode build never runs
# buf, so a .proto edit committed without `mise run generate:proto` surfaces much
# later as a confusing Swift compile error.
#
# Against HEAD rather than the index, because "committed" is what the check is
# about: a bare `git diff` compares against the index, which passes on drift that
# happens to be staged — and in a GitButler workspace, where the index is not
# kept in step with the virtual branches, fails on generated files that are
# already committed.
run = ["mise run generate:proto", "git diff --exit-code HEAD -- ios/Packages/OndCore/Sources/OndAPI/Generated"]

[tasks."check:audit"]
description = "Match Cargo.lock against the RustSec advisory database"
# Deliberately outside the `check` chain and outside CI's per-push lint job.
# Every other check is a pure function of the tree; this one changes its answer
# when somebody else publishes an advisory, so in the gate it would eventually
# fail a commit that touched nothing related — and what that teaches at 6pm is
# to skip the gate. A failure that arrives on the calendar wants a run on the
# calendar: .github/workflows/audit.yml, nightly and on any Cargo.lock change.
#
# It also needs the network, which `check` otherwise does not — SQLX_OFFLINE and
# the committed .sqlx cache exist precisely so the gate runs on a plane.
run = "cargo audit"

[tasks."check:deps"]
description = "Report crate dependencies nothing imports"
# Blind spot worth knowing: machete reads each *member's* [dependencies], so an
# unused entry in the root [workspace.dependencies] is invisible to it. Check
# that table by hand when removing a dependency.
run = "cargo machete --with-metadata"

# test

[tasks.test]
description = "Run every test suite"
run = ["mise run test:rs", "mise run test:e2e", "mise run test:swift"]

[tasks."test:rs"]
description = "Rust unit tests — no database, no network"
# Scoped to lib and bin targets so this stays the fast inner-loop suite. The
# integration tests live in their own target and need Postgres; `test:e2e` runs
# those.
env = { CARGO_TARGET_DIR = "{{env.CHECK_TARGET_DIR}}" }
run = "cargo nextest run --workspace --lib --bins"

[tasks."test:e2e"]
description = "Integration tests: the real router over a disposable database"
depends = ["dev:db"]
# Each test creates and migrates its own `ond_test_<name>` database, so they
# neither share state nor touch the development one. nextest runs each test in
# its own process, which is what makes per-test databases the natural unit.
env = { CARGO_TARGET_DIR = "{{env.CHECK_TARGET_DIR}}" }
run = "cargo nextest run -p api --test e2e"

[tasks."assistant:smoke"]
description = "Make one real call to the model provider and print what it said"
depends = ["dev:db"]
# The only task in this file that spends money and the only one that leaves the
# machine, which is why it is `#[ignore]`d out of every other suite rather than
# guarded by a variable someone could set by accident. One call, on the cheapest
# model in the catalogue, through the same service path an RPC takes — so what
# it proves is that the key, the model id, the request body, and the parser all
# still agree with a provider no test double can stand in for.
#
# The filter names a *category* — every `smoke_*` test — rather than one
# function, so renaming a test cannot quietly make this task pass by running
# nothing, and a second paid check joins by being named.
#
# `--no-capture` because the printed answer *is* the result. No key in the
# environment is a skip, not a failure.
env = { CARGO_TARGET_DIR = "{{env.CHECK_TARGET_DIR}}" }
run = "cargo nextest run -p api --test e2e --run-ignored only -E 'test(/::smoke_/)' --no-capture"

[tasks."test:swift"]
dir = "{{config_root}}/ios"
run = "swift test --package-path Packages/OndCore"

# web

[tasks."web:serve"]
description = "Serve the marketing one-pager locally"
# 18102: next free port in the 18100–18199 block (API 18100, Postgres 18101).
run = "pnpm dlx serve --listen 18102 {{config_root}}/web"

# infra: the AWS deployment, defined in infra/ and applied deliberately —
# nothing below runs from `check` or CI, and only the apply tasks touch AWS.
#
# Every task that reaches AWS pins AWS_PROFILE, for the same reason DATABASE_URL
# is pinned above: an ambient value inherited from another repo's shell is
# indistinguishable from the right one until it has already done something.
# `ond` is the profile for the IAM user infra/bootstrap creates; `holmie` is the
# account root, and bootstrap is the only thing that may still use it.

[tasks."infra:bootstrap:init"]
description = "Initialise the bootstrap root (state bucket + IAM user; local state)"
dir = "{{config_root}}/infra/bootstrap"
run = "tofu init"

[tasks."infra:bootstrap:apply"]
description = "Create the OpenTofu state bucket and the ond-tofu IAM user (runs as account root; once)"
dir = "{{config_root}}/infra/bootstrap"
env = { AWS_PROFILE = "holmie" }
run = "tofu apply"

[tasks."infra:init"]
description = "Initialise OpenTofu (downloads providers and modules; reaches the S3 backend)"
dir = "{{config_root}}/infra"
env = { AWS_PROFILE = "ond" }
run = "tofu init"

[tasks."infra:plan"]
description = "Preview infrastructure changes (needs AWS credentials, changes nothing)"
dir = "{{config_root}}/infra"
env = { AWS_PROFILE = "ond" }
run = ["tofu fmt -check -diff", "tofu validate", "tofu plan"]

[tasks."infra:apply"]
description = "Apply infrastructure changes to AWS"
dir = "{{config_root}}/infra"
env = { AWS_PROFILE = "ond" }
run = "tofu apply"

[tasks.deploy]
description = "Build the release image, ship it to the box over SSH, migrate, restart"
# No registry: one box makes `docker save | ssh docker load` the whole supply
# chain. The host derives from the infra state rather than an env var, so there
# is exactly one answer to where production is.
env = { AWS_PROFILE = "ond" }
run = ["""
  set -eu
  # .dockerignore excludes .git, so build.rs cannot read the commit itself —
  # without this, /about reports "unknown" and cannot say what is deployed.
  docker build --platform linux/arm64 \
    --build-arg GIT_COMMIT_HASH="$(git rev-parse --short HEAD)" \
    -t ond-api:latest .
  """, """
  set -eu
  host="ubuntu@$(tofu -chdir=infra output -raw elastic_ip)"
  docker save ond-api:latest | gzip | ssh "$host" 'gunzip | docker load'
  rsync -az infra/box/ "$host":/srv/ond/
  # Under /srv/ond rather than its own tree, so one directory holds
  # everything a deploy ships and compose can mount it by relative path.
  rsync -az --delete web/ "$host":/srv/ond/web/
  # Caddy is restarted explicitly, and it has to be. Its config arrives as a
  # bind-mounted file, so rsyncing a new Caddyfile changes nothing compose can
  # see: the container spec is identical, `up -d` leaves it running, and Caddy
  # goes on serving the config it parsed at boot. The failure is silent and it
  # is routing — a deploy that moves an API path ships the new binary behind
  # the old routing table, so every moved RPC 404s into file_server while
  # /health, matched by both tables, still answers ok.
  ssh "$host" 'cd /srv/ond && docker compose --profile tools run --rm migrate && docker compose up -d --remove-orphans && docker compose restart caddy'
  """]

# ios

[tasks."ios:gen"]
description = "Generate Ond.xcodeproj from ios/project.yml"
dir = "{{config_root}}/ios"
# The plutil step bakes this Mac's Bonjour address into the freshly generated
# (gitignored) Info.plist. Debug builds fall back to it when the
# OND_API_BASE_URL environment variable is absent — which is every launch
# from the home screen, where no debugger means no environment — so a device
# build keeps working untethered. The Bonjour name rather than the LAN IP
# because it survives a DHCP renewal, and derives per machine with no config:
# whoever generates the project gets their own Mac baked in.
# Both apps get the same address baked in: the watch talks to the backend
# directly rather than proxying through the phone (roadmap M9), so it needs the
# URL just as much and from the same source.
run = ["xcodegen generate", '''
  url="http://$(scutil --get LocalHostName).local:18100"
  plutil -replace OndAPIBaseURL -string "$url" Ond/Info.plist
  plutil -replace OndAPIBaseURL -string "$url" OndWatch/Info.plist
  ''']

[tasks."ios:open"]
description = "Generate the project and open it in Xcode"
depends = ["ios:gen"]
run = "open {{config_root}}/ios/Ond.xcodeproj"

[tasks."ios:build"]
description = "Build the app for the simulator without opening Xcode"
depends = ["ios:gen"]
dir = "{{config_root}}/ios"
# The generic destination builds without naming a device, so this works on any
# machine regardless of which simulators its Xcode happens to have installed.
run = "xcodebuild -project Ond.xcodeproj -scheme Ond -destination 'generic/platform=iOS Simulator' build"

[tasks."ios:sim"]
description = "Build, install, and launch the app on the booted iOS simulator"
depends = ["ios:build"]
dir = "{{config_root}}/ios"
# `booted` rather than a named device, for the same reason `ios:build` uses a
# generic destination: whichever simulator is already open is the one being
# looked at, and naming one here would tie the task to the machine that wrote it.
# The product directory is asked of xcodebuild rather than assumed, because
# DerivedData's path is a hash of the project's location.
run = '''
  products=$(xcodebuild -project Ond.xcodeproj -scheme Ond \
    -destination 'generic/platform=iOS Simulator' -showBuildSettings 2>/dev/null \
    | awk -F' = ' '/ BUILT_PRODUCTS_DIR /{print $2; exit}')
  xcrun simctl install booted "$products/Ond.app"
  xcrun simctl launch booted xyz.holmie.ond
'''

[tasks."ios:build:watch"]
description = "Build the watch app for the simulator without opening Xcode"
depends = ["ios:gen"]
dir = "{{config_root}}/ios"
# Separate from `ios:build` rather than folded into it: the phone scheme embeds
# the watch app, so building it covers both, but a watch-only change wants a
# build that fails on the wrist's compiler errors alone.
run = "xcodebuild -project Ond.xcodeproj -scheme OndWatch -destination 'generic/platform=watchOS Simulator' build"
