[package]
name = "api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# Proprietary — never meant for crates.io, so fence off `cargo publish`.
publish = false

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
prost.workspace = true
prost-types.workspace = true
serde.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tonic-reflection.workspace = true
tonic-web.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
# The integration harness creates its disposable database through the same
# functions `mise run migrate` uses, so the schema under test is the real one.
migrate = { path = "../migrate" }
tower.workspace = true

[build-dependencies]
chrono.workspace = true
tonic-prost-build.workspace = true

# `cargo machete` reads the crate's own source and cannot see code generated into
# OUT_DIR, so it reports every dependency that only the generated protobuf module
# uses. All four were verified by deleting them and rebuilding:
#   prost              — `::prost::Message` / `::prost::Enumeration` derives
#   tonic-prost        — `tonic_prost::ProstCodec` in the generated client/server
#   tonic-prost-build  — build.rs, which machete does not analyse
# Re-verify by removing one and running `cargo build -p api` before assuming this
# list is stale.
[package.metadata.cargo-machete]
ignored = ["prost", "tonic-prost", "tonic-prost-build"]

[lints]
workspace = true
