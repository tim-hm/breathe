# What runs on the box, rsynced to /srv/ond by `mise run deploy`. The
# ${POSTGRES_PASSWORD} interpolations read /srv/ond/.env — a symlink onto
# the data volume, written once at first boot by cloud-init.

# Docker's json-file driver keeps everything for ever by default, and the only
# disk it can fill is the one Postgres writes to. Nothing ships these logs
# anywhere, so 50 MiB per resident service is the whole retention policy:
# enough to read back an incident over `docker compose logs`, bounded enough
# that a chatty week cannot take the database down. `migrate` is deliberately
# exempt: `run --rm` deletes its log file along with the container.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  caddy:
    <<: *logging
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The marketing one-pager, rsynced beside this file by `mise run deploy`.
      # Static files served straight off disk: nothing builds it, and no second
      # container exists to serve two files.
      - ./web:/srv/web:ro
      # Certificates. Losing this volume means re-issuing against ACME rate
      # limits, so it persists across deploys like any other data.
      - caddy-data:/data
      - caddy-config:/config

  api:
    <<: *logging
    image: ond-api:latest
    restart: unless-stopped
    environment:
      OND_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/ond?sslmode=disable
      # The assistant's provider key, from the same env file the password comes
      # from. Optional and defaulted to empty: an unset key is a supported state
      # — the assistant answers from its rule-based fallback and the rest of the
      # API is unaffected — and without the default, compose would refuse to
      # start the stack on a box where nobody has added one.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  # One-shot, run by `mise run deploy` before the api restarts — never resident.
  migrate:
    image: ond-api:latest
    profiles:
      - tools
    command: migrate
    environment:
      # Set for the same reason the api service sets it: migrate chooses its log
      # format from this, and every deploy runs it. Unset, the one record of
      # whether the schema applied arrives as prose beside everything else's JSON.
      OND_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/ond?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  db:
    <<: *logging
    image: postgres:18-alpine
    restart: unless-stopped
    # No host port mapping: only the compose network can reach Postgres. Admin
    # access goes through `docker compose exec db psql` over SSH.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      # The EBS data volume. `/var/lib/postgresql`, not `/data` — same Postgres
      # 18 path caveat as the dev compose.yaml at the repo root.
      - /srv/data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  caddy-data:
  caddy-config:
