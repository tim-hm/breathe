included:
  - Breathe
  - BreatheWatch
  - Packages/BreatheCore/Sources
  - Packages/BreatheCore/Tests

excluded:
  # Generated by protoc-gen-swift and protoc-gen-connect-swift. They already
  # carry `// swiftlint:disable all`, but excluding the directory means a new
  # generated file is covered before anyone notices it exists.
  - Packages/BreatheCore/Sources/BreatheAPI/Generated
  - Packages/BreatheCore/.build

# Opt-in rules that catch real defects rather than style preferences.
opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - empty_count
  - first_where
  - last_where
  - redundant_nil_coalescing
  - unneeded_parentheses_in_closure_argument
  - overridden_super_call
  - prohibited_super_call

disabled_rules:
  # SwiftFormat owns line width (--maxwidth 100); two tools disagreeing about
  # the same thing means one of them is always wrong.
  - line_length
  # Same rule, same reason: SwiftFormat's `trailingCommas` adds the comma that
  # this rule removes, so leaving both on makes every multi-line collection
  # literal unformattable — `fmt` and `check` would undo each other forever.
  - trailing_comma
  # Domain vocabulary is what it is: `id` is the field name in the proto, and
  # renaming it in Swift alone would break the correspondence deliberately.
  - identifier_name

force_unwrapping:
  severity: error

custom_rules:
  # The failure mode this catches is silent: `os.Logger` interpolates `String`
  # as `.private`, so a line missing the annotation reads `<private>` in a
  # sysdiagnose or a TestFlight bundle and nowhere else — which is to say, in
  # every place it was collected for and none of the places it is written.
  # Framework error text carries no user data; see docs/observability.md.
  redacted_error_cause:
    name: "Redacted error cause"
    regex: '\\\([^)]*localizedDescription\)'
    message: "os.Logger redacts String by default — add `, privacy: .public`"
    severity: error

# `analyzer_rules` (unused_import and friends) are deliberately absent. They only
# run under `swiftlint analyze`, which needs a full compiler log to be built
# first — so listing them here would look like enforcement while `check:swift`
# quietly never ran them. Add them alongside an `analyze` task or not at all.
