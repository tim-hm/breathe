# The Xcode project is generated from this file by `mise run ios:gen`; the
# resulting Ond.xcodeproj is gitignored. Adding a source file means adding it
# to disk under Ond/ — the `sources` glob below picks it up on the next
# generate, and no one ever resolves a pbxproj conflict.

name: Ond

options:
  bundleIdPrefix: xyz.holmie
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  # Mirrors the on-disk folder structure in Xcode's navigator, so Features/
  # reads the same in the IDE as it does in the repo.
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6 language mode. Data-race safety is checked at compile time, which
    # is worth far more in an app built around a timing loop than it costs here.
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # XcodeGen substitutes this from the environment at generate time, so the
    # team id stays out of the repo and each developer supplies their own.
    # Unset, XcodeGen writes the reference through verbatim and Xcode resolves
    # it as an undefined build setting — i.e. no team, which is exactly what a
    # simulator build wants. Only a device or archive build needs the variable,
    # and now that the phone app embeds the watch app both bundles must be
    # signed by the same team, which is why this sits at project level.
    DEVELOPMENT_TEAM: ${OND_DEV_TEAM}
    # Xcode mints and renews the certificates and profiles itself. Stated
    # rather than left to default because the alternative — manual signing —
    # means committing profile names that expire, and `ios:archive` passes
    # `-allowProvisioningUpdates` on the strength of this line.
    CODE_SIGN_STYLE: Automatic
    # Both version numbers sit at project level because the two bundles may not
    # disagree: App Store validation rejects a submission whose embedded watch
    # app carries a different CFBundleShortVersionString or CFBundleVersion
    # from its host. Set per target, they would drift on the first release
    # somebody bumped in one place.
    #
    # CURRENT_PROJECT_VERSION is the floor, not the shipped value:
    # `ios:archive` overrides it with the commit count, because App Store
    # Connect refuses a build number it has already seen and a number derived
    # from history cannot repeat.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  OndCore:
    path: Packages/OndCore

targets:
  Ond:
    type: application
    platform: iOS
    sources:
      - path: Ond
        # The StoreKit configuration is a build-time input to the *scheme*, not
        # a resource. Left in the glob, XcodeGen files an unrecognised extension
        # under Resources and it would ship inside the release bundle.
        excludes:
          - Ond.storekit
      - path: Ond/Ond.storekit
        buildPhase: none
    dependencies:
      # OndAPI is absent because it is not a product of OndCore at all —
      # the app cannot name that module even by accident. See the target notes in
      # Packages/OndCore/Package.swift.
      - package: OndCore
        product: OndKit
      - package: OndCore
        product: OndUI
      # The domain→token mappings both apps read, so a goal is the same colour
      # on the wrist as in the hand.
      - package: OndCore
        product: OndStyle
      # Embeds the watch app in the phone app's bundle, which is the only way
      # the pair reaches a device or App Store Connect as one submission.
      # XcodeGen reads the dependency's platform and emits the embed build
      # phase itself, so a plain target dependency is the whole declaration.
      - target: OndWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.holmie.ond
        # iPhone only. Xcode's default is iPhone and iPad, and the pair is not
        # coherent with the portrait-only rule below: iPadOS 26 ignores
        # UIRequiresFullScreen, so an iPad build must support every orientation
        # or fail validation — and a session held still in one hand is not an
        # iPad. Claiming the family would also oblige the listing to carry iPad
        # screenshots of a layout nobody has designed.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The catalogue's AccentColor mirrors Accent/Brand in OndUI, in both
        # appearances. It has to be duplicated here: the system tints its own
        # controls from an asset in the app bundle and cannot read a package's,
        # so this file is what a navigation link is drawn in and the Theme
        # constant is what views ask for.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: önd
        # Portrait only. A breathing session is held still in one hand; a
        # rotation mid-cycle interrupts the one thing the app is for.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    # Generated at `ios:gen` time, exactly like the Info.plist below, and
    # gitignored for the same reason: one editable source per dictionary.
    entitlements:
      path: Ond/Ond.entitlements
      properties:
        com.apple.developer.healthkit: true
        # Sign in with Apple. `Default` is the whole of the value for a
        # first-party app signing into its own backend — the alternative,
        # `Default` plus an existing-account grant, is for migrating people off
        # a username and password this app has never had. The capability must
        # also be enabled on the App ID in the developer portal, or a device
        # build fails to sign with a provisioning-profile mismatch rather than
        # anything naming Apple sign-in.
        com.apple.developer.applesignin: [Default]
    # An `info:` block rather than more INFOPLIST_KEY_* settings above, because
    # those only carry scalars and arrays — NSAppTransportSecurity is a dict and
    # has no build-setting form. The generated plist is gitignored.
    info:
      path: Ond/Info.plist
      properties:
        # Answers App Store Connect's export-compliance question in the bundle
        # instead of in the web UI. Without the key every upload lands in
        # "Missing Compliance" and cannot go to a single tester until someone
        # clicks through the same question again. `false` is the declaration
        # for an app whose only cryptography is the HTTPS the OS provides —
        # önd ships no algorithm of its own — and it is the answer that would
        # be given by hand anyway, made once and reviewably.
        ITSAppUsesNonExemptEncryption: false
        # The dev backend is plain HTTP on localhost, which App Transport
        # Security blocks by default. `NSAllowsLocalNetworking` is the narrow
        # exemption for exactly that: it permits cleartext to loopback, .local,
        # and private-range addresses only, and grants nothing towards arbitrary
        # internet hosts the way NSAllowsArbitraryLoads would. It can therefore
        # stay in the Release build without weakening it — a production backend
        # on HTTPS is unaffected either way.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Talking to the dev Mac over the LAN is "local network" use under iOS
        # 14+ privacy rules: the first request triggers a system prompt, and this
        # string is the explanation shown in it. Without the key the connection
        # can be denied with no prompt at all — a silent transport error that
        # looks exactly like the server being down.
        NSLocalNetworkUsageDescription: >-
          During development, önd connects to the development server on your local network to load the technique catalogue.
        # Both Health strings are shown in the system's authorization sheet,
        # and App Review rejects vague ones. The share string ships ahead of
        # the read feature it describes: the key must be in the bundle before
        # the first read request, and a missing key is a crash, not a refusal.
        NSHealthShareUsageDescription: >-
          önd reads your resting heart rate and heart-rate variability trends, and shares them with your coach only when you choose to, so its guidance can reflect how your body is responding.
        NSHealthUpdateUsageDescription: >-
          önd records each breathing session you keep in Health as Mindful Minutes.

  OndWatch:
    type: application
    platform: watchOS
    sources:
      - path: OndWatch
    dependencies:
      # Same three products, and OndAPI absent for the same reason: the
      # watch is another client of the domain, not a second place generated
      # protobuf is allowed to surface.
      - package: OndCore
        product: OndKit
      - package: OndCore
        product: OndUI
      - package: OndCore
        product: OndStyle
    settings:
      base:
        # A companion watch app's bundle id must be the phone app's with one
        # component appended; the system pairs the two by that prefix and
        # rejects the bundle outright if it does not hold.
        PRODUCT_BUNDLE_IDENTIFIER: xyz.holmie.ond.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        # Names the appiconset actool compiles for this target, which is what
        # writes CFBundleIconName into the watch bundle's Info.plist. Without
        # the key App Store Connect rejects the upload (ITMS-90713) — during
        # processing, before the build can be offered to a single TestFlight
        # tester, and against the embedded watch bundle as much as the host.
        # A green `xcodebuild archive` says nothing about it: that check runs
        # on Apple's side once the binary has been delivered.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: önd
    # Same generated-not-committed arrangement as the phone target's.
    entitlements:
      path: OndWatch/OndWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: OndWatch/Info.plist
      properties:
        # Marks the bundle as a modern single-target watch app rather than a
        # WatchKit app plus extension, which is what lets it be built from one
        # target at all.
        WKApplication: true
        WKCompanionAppBundleIdentifier: xyz.holmie.ond
        # Same declaration as the phone target's, and needed separately: the
        # watch app is validated as its own bundle inside the submission.
        ITSAppUsesNonExemptEncryption: false
        # The watch talks to the backend itself — it holds its own copy of the
        # identity and its own catalogue cache, so a session on the wrist must
        # not stall waiting for a phone that is in another room.
        WKRunsIndependentlyOfCompanionApp: true
        # What lets a session keep cueing with the wrist down and the screen
        # dim: without this key `WKExtendedRuntimeSession.start()` fails with
        # `notApprovedToStartSession` and the haptics stop the moment the app
        # is no longer frontmost. `mindfulness` is the type for silent
        # meditation — a guided breath is exactly that, and it grants an hour,
        # comfortably past the longest technique in the catalogue. Only one of
        # the extended-runtime types may be declared, so this is a choice
        # rather than a list: `self-care` is for brief health activities and
        # would cap the session shorter.
        WKBackgroundModes:
          - mindfulness
        # Both keys carry the same meaning as on the phone target above: the
        # narrow cleartext exemption for a dev backend on the LAN, and the
        # string iOS shows in the local-network prompt.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: >-
          During development, önd connects to the development server on your local network to load the technique catalogue.
        # Same two Health strings as the phone target, same App Review stakes.
        NSHealthShareUsageDescription: >-
          önd reads your resting heart rate and heart-rate variability trends, and shares them with your coach only when you choose to, so its guidance can reflect how your body is responding.
        NSHealthUpdateUsageDescription: >-
          önd records each breathing session you keep in Health as Mindful Minutes.

schemes:
  Ond:
    build:
      targets:
        Ond: all
    # Without this, the scheme's Testables list is empty and ⌘U runs zero
    # tests. Wiring the package test target makes Xcode's Test action run the
    # same suites as `mise run test:swift`.
    test:
      config: Debug
      targets:
        - package: OndCore/OndKitTests
        - package: OndCore/OndUITests
    run:
      config: Debug
      # The whole purchase flow works in the simulator against this file: local
      # products, local prices, and a purchase sheet that needs no App Store
      # Connect record and no sandbox account. It is a debug affordance and
      # nothing else — a device or TestFlight build resolves products from the
      # real App Store, because the scheme is not what ships.
      #
      # This line only reaches a run Xcode itself started. A build installed and
      # launched by `simctl` gets no scheme at all and therefore no products, so
      # `mise run ios:sim` copies the file to the simulator the way Xcode does;
      # a hand-rolled `simctl launch` does not, and every purchase under one
      # fails as `productUnavailable`.
      #
      # Note what a simulator purchase does *not* exercise: transactions minted
      # here are signed by a per-machine Xcode test certificate, so the server
      # refuses them. That is the offline-first design working — the UI is
      # entitled locally regardless — and it is why the server half needs a
      # sandbox tester on a real device.
      storeKitConfiguration: Ond/Ond.storekit
      # `OND_API_BASE_URL` is deliberately not set here, and a physical
      # device must not rely on it either: scheme environment variables exist
      # only under Xcode's debugger, so an app opened from the home screen
      # never sees them. Device builds instead read the URL `ios:gen` bakes
      # into the gitignored Info.plist — the generating Mac's Bonjour address.
      # The variable remains an override for pointing one debug run somewhere
      # unusual.

  OndWatch:
    build:
      targets:
        OndWatch: all
    # No `test:` block. Every Swift suite lives in OndCore and runs on the
    # host through `mise run test:swift`; wiring them here as well would mean a
    # watch simulator boot for tests that need no watch.
    run:
      config: Debug
