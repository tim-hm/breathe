syntax = "proto3";

package breathe.v1;

// AssistantService turns what somebody told us at onboarding into guidance: a
// short ranked list of techniques to try, and an explanation of why a technique
// works, written for how much breathwork they have done before.
//
// Scoped to the caller exactly like ProfileService — the anonymous identity
// travels in the `breathe-user-id` header and no request message carries a
// profile, so one client can never ask for guidance shaped by another's
// answers.
//
// Every RPC here answers. A language model sits behind both of them, and it can
// be unreachable, rate-limited, or over the caller's daily quota; when it is,
// the server falls back to a rule-based answer derived from the same profile
// rather than failing the call. `AssistantSource` on the response says which
// happened, so a client can be honest about it instead of guessing.
service AssistantService {
  // Returns techniques to try next, best first.
  //
  // The request carries nothing: the server already holds the profile the
  // ranking is derived from, and a client that sent its own copy would let a
  // stale one decide what it is told.
  rpc GetRecommendation(GetRecommendationRequest) returns (GetRecommendationResponse);

  // Streams an explanation of why one technique works.
  //
  // Server-streaming because perceived latency is the whole point: an
  // explanation arrives a sentence at a time and the reader starts reading
  // immediately, where a unary call would show a spinner for as long as the
  // model takes to finish.
  rpc ExplainTechnique(ExplainTechniqueRequest) returns (stream ExplainTechniqueResponse);

  // Streams the coach's reply to one message in a conversation.
  //
  // On this service rather than its own, because a conversation shares
  // everything the one-shot RPCs already settled: the same identity scoping,
  // the same daily allowance, the same fallback doctrine, and the same
  // `AssistantSource` honesty on every chunk.
  //
  // The server keeps no conversation state at all — no transcript, no prompt,
  // no reply is persisted or logged anywhere. The transcript lives on the
  // device, and each call carries as much of it as the client wants read back.
  rpc Chat(ChatRequest) returns (stream ChatResponse);
}

// Where an answer came from.
//
// Carried on every response so the client can say "this one is written for you"
// only when it is. The distinction is user-visible copy, not telemetry.
enum AssistantSource {
  ASSISTANT_SOURCE_UNSPECIFIED = 0;

  // A language model, given the catalogue and this person's profile.
  ASSISTANT_SOURCE_MODEL = 1;

  // The server's own rules, from the goals the person picked. What every caller
  // gets when the model is unreachable, has failed repeatedly, or the caller has
  // spent their daily quota — and what every caller gets offline, since a client
  // that cannot reach the server shows the same shape of answer.
  ASSISTANT_SOURCE_FALLBACK = 2;
}

// Coarse heart trends, computed on the phone from its own Health store and
// attached per request when — and only when — the person has switched on the
// in-app opt-in.
//
// This message deliberately inverts the empty-request rule the RPCs above
// follow. Requests here carry nothing because the server already holds the
// fresher copy of the profile — but health data is the one thing the server
// never holds: it is never persisted and never logged there, so the device is
// its only holder and the client's copy is by definition the fresh one. The
// server reads it once, folds it into the prompt for this call, and forgets it.
//
// Every field is a rounded whole-unit summary — a 7-day mean, or that mean's
// delta against the weeks before — with no timestamps and no raw readings.
// Absent fields mean the phone had too little evidence, or the person shared
// nothing; the server treats both identically. Values outside physiological
// range are dropped server-side, field by field, never failing the request.
message HealthContext {
  // 7-day mean resting heart rate, in beats per minute.
  optional sint32 resting_hr_bpm = 1;

  // The mean's delta against the person's earlier baseline, in beats per
  // minute. Signed: positive is above baseline.
  optional sint32 resting_hr_trend_bpm = 2;

  // 7-day mean heart-rate variability (SDNN), in milliseconds.
  optional sint32 hrv_sdnn_ms = 3;

  // The SDNN mean's delta against the earlier baseline, in milliseconds.
  // Signed on the same terms as the resting-heart-rate trend.
  optional sint32 hrv_sdnn_trend_ms = 4;

  // Held for `session_hr_response_bpm`, the in-session heart-rate response
  // summary, which ships with the hardware slice that can actually measure it.
  reserved 5;
}

// Who said one turn of a conversation.
enum ChatRole {
  CHAT_ROLE_UNSPECIFIED = 0;

  // The person using the app.
  CHAT_ROLE_PERSON = 1;

  // The coach — this service's own earlier replies, read back to it.
  CHAT_ROLE_COACH = 2;
}

// One turn of the conversation, as the device remembers it.
message ChatTurn {
  // Never UNSPECIFIED: a turn that does not say who spoke is INVALID_ARGUMENT,
  // because the server hands these to the model as genuinely attributed
  // speech and cannot guess an attribution.
  ChatRole role = 1;

  // What was said. Bounded to the same length as a new message; a longer turn
  // fails the request rather than being silently trimmed.
  string text = 2;
}

message ChatRequest {
  // The conversation so far, oldest first, supplied by the client. The server
  // holds no transcript, so the device's copy is the only one — the same
  // inversion of the empty-request rule `HealthContext` documents. COACH turns
  // cannot be verified as genuinely the coach's words; they are accepted and
  // treated as conversation data, on the same terms as the intent note. Only
  // the most recent turns are read; older ones are silently ignored.
  repeated ChatTurn history = 1;

  // The person's new message. Required, and bounded; an empty or over-long
  // message is INVALID_ARGUMENT.
  string message = 2;

  // The same coarse heart trends the other two RPCs may carry, on the same
  // terms: optional, device-computed, used transiently, never stored.
  HealthContext health_context = 3;
}

message ChatResponse {
  // The next piece of the reply, to be appended to what came before — chunk
  // boundaries carry no meaning, exactly as on `ExplainTechniqueResponse`.
  string text = 1;

  // Identical on every chunk of one stream. FALLBACK here is a short fixed
  // sentence rather than a conversation: the rules can rank exercises, but
  // they cannot chat.
  AssistantSource source = 2;
}

message GetRecommendationRequest {
  // See `HealthContext` for why this request is no longer empty. Absent when
  // the person has not opted in, when Health has nothing to summarise, or when
  // the client predates the field — the server behaves identically in all
  // three cases. Message fields track presence on their own, so no `optional`.
  HealthContext health_context = 1;
}

// One technique worth trying, and why.
message Recommendation {
  // A slug from the catalogue `TechniqueService.ListTechniques` serves, always.
  // The server validates every slug a model produces against the catalogue and
  // drops the ones it invented, so a client can look this up without a
  // defensive branch for a technique it has never heard of.
  string technique_slug = 1;

  // One sentence, addressed to the person, grounded in the goals and experience
  // level they gave. Never empty.
  string reason = 2;
}

message GetRecommendationResponse {
  // Best first, and bounded — this is a nudge towards a next session, not a
  // second catalogue. Never empty: a model that returned nothing usable falls
  // back to the rules rather than an empty list the client has to explain.
  repeated Recommendation recommendations = 1;

  AssistantSource source = 2;
}

message ExplainTechniqueRequest {
  // A catalogue slug. Unknown slugs are NOT_FOUND rather than an invented
  // explanation.
  string technique_slug = 1;

  // The same coarse heart trends `GetRecommendationRequest` may carry, on the
  // same terms: optional, device-computed, used transiently, never stored.
  HealthContext health_context = 2;
}

message ExplainTechniqueResponse {
  // The next piece of the explanation, to be appended to what came before.
  // Chunk boundaries are wherever the model happened to break and carry no
  // meaning — a client accumulates them and renders the running total.
  string text = 1;

  // Identical on every chunk of one stream, so a client reading the first
  // message already knows whether to say the explanation was written for this
  // person. Repeating it costs a byte and saves a header contract.
  AssistantSource source = 2;
}
