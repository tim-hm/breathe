syntax = "proto3";

package breathe.v1;

import "google/protobuf/timestamp.proto";

// EntitlementService turns an App Store purchase into something the server can
// act on.
//
// The client already knows which tier somebody is on — StoreKit answers that
// offline, and every piece of UI gating reads it from there. This service
// exists for the one decision the client must not make: whether a caller may
// spend a language-model call. `AssistantService` reads the tier from the row
// `SubmitAppStoreTransaction` wrote, never from anything a request carries, so
// a modified client can claim Coach all it likes and still get the rules.
//
// The catalogue's lock is deliberately *not* here. A session runs on the
// device, so a subscription check in front of it would guard nothing; the
// division is that the server enforces what costs money to serve and the client
// enforces what does not.
//
// Scoped to the caller exactly like ProfileService — the anonymous identity
// travels in the `breathe-user-id` header and no request message carries an id.
service EntitlementService {
  // Verifies a StoreKit signed transaction and stores what it grants.
  //
  // The JWS is verified in-process against Apple's root certificate; nothing
  // here calls the App Store Server API, so a purchase is honoured even while
  // Apple's servers are unreachable.
  //
  // Idempotent on the transaction's original id: a client that submits the same
  // JWS on every launch — which is exactly what the retry-on-next-launch client
  // does — writes the same entitlement rather than a second one or an error.
  rpc SubmitAppStoreTransaction(SubmitAppStoreTransactionRequest) returns (SubmitAppStoreTransactionResponse);

  // Returns what the server currently believes the caller is entitled to.
  //
  // Never NOT_FOUND: a caller who has never purchased anything is FREE, which is
  // a state rather than an absence.
  rpc GetEntitlement(GetEntitlementRequest) returns (GetEntitlementResponse);
}

// What a person may use.
//
// Ordered, and the order is load-bearing: every tier includes everything below
// it, so a check is "at least this" rather than "exactly this". The numbers are
// what express that — a client comparing them can add a tier above COACH
// without revisiting every gate.
//
// UNSPECIFIED is never stored or served — the server resolves every caller to
// one of the three — and exists only because proto3 demands a zero value. A
// client that receives it should treat it as FREE, which the ordering already
// makes the natural reading.
enum EntitlementTier {
  ENTITLEMENT_TIER_UNSPECIFIED = 0;

  // The app, and the two techniques it opens with. Everything that is not the
  // catalogue's breadth or the language model: the session player, the whole
  // journey and its leaderboards, schedules, the journal, the basics.
  ENTITLEMENT_TIER_FREE = 1;

  // önd Plus. The full catalogue, and everything the app does that does not
  // cost us money per use.
  ENTITLEMENT_TIER_PLUS = 2;

  // önd Coach. Plus, and the assistant backed by a language model —
  // recommendations written for this person and explanations at their level.
  // The one tier with a marginal cost behind it, which is why it is the one
  // tier this server enforces.
  ENTITLEMENT_TIER_COACH = 3;
}

// What the server holds for one person.
message Entitlement {
  // Derived from `expires_at` against the server's clock at the moment of the
  // call, not stored: a subscription that lapsed overnight has to read as FREE
  // on the next call without anything having run in between.
  EntitlementTier tier = 1;

  // When the current period ends. Absent on FREE, and absent is the only thing
  // FREE ever carries — a past timestamp would invite a client to render an
  // expiry date for a subscription nobody has.
  google.protobuf.Timestamp expires_at = 2;
}

message SubmitAppStoreTransactionRequest {
  // A StoreKit 2 `Transaction.jwsRepresentation`, verbatim: three
  // base64url segments separated by dots, whose header carries the certificate
  // chain the signature is checked against.
  //
  // Sent rather than the decoded payload because the signature is the whole
  // point — a client that decoded the transaction first would be asking the
  // server to trust its parsing.
  string signed_transaction = 1;
}

message SubmitAppStoreTransactionResponse {
  // The entitlement as stored, which is what the client should believe. A
  // submission that verified but granted nothing — an expired or refunded
  // transaction — comes back FREE rather than as an error: nothing went wrong,
  // and the caller is simply not a subscriber.
  Entitlement entitlement = 1;
}

message GetEntitlementRequest {}

message GetEntitlementResponse {
  Entitlement entitlement = 1;
}
