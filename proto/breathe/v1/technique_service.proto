syntax = "proto3";

package breathe.v1;

// TechniqueService serves the catalogue of breathing techniques.
//
// A technique is reference data: a name, the goal it serves, and the ordered
// stages a session plays. It carries no user state — what a person did with a
// technique is a separate concern, so this service stays readable without
// authentication. The same holds for the breathing foundations it also serves.
service TechniqueService {
  // Lists every technique, ordered for presentation.
  //
  // Unpaginated on purpose. The catalogue is curated and small (single digits
  // now, tens at most), so a cursor would add a round-trip contract the client
  // has to honour in exchange for nothing.
  rpc ListTechniques(ListTechniquesRequest) returns (ListTechniquesResponse);

  // Lists the breathing foundations — the questions most apps never answer
  // (belly or chest, nose or mouth, posture, eyes), as reference data rather
  // than copy baked into a client.
  //
  // Same no-auth stance and same lack of pagination as the catalogue, for the
  // same reasons.
  rpc ListFoundations(ListFoundationsRequest) returns (ListFoundationsResponse);
}

// The outcome a technique is chosen for. Drives how the catalogue is grouped in
// the UI, so a technique has exactly one — the primary reason to reach for it.
enum TechniqueGoal {
  TECHNIQUE_GOAL_UNSPECIFIED = 0;

  // Down-regulate in the moment: anxiety, pre-performance nerves, acute stress.
  TECHNIQUE_GOAL_CALM = 1;

  // Wind down towards sleep. Long exhales, no holds sharp enough to rouse.
  TECHNIQUE_GOAL_SLEEP = 2;

  // Raise alertness. Fast, exhale-driven, and the one category with real
  // contraindications — never practised in water or while driving.
  TECHNIQUE_GOAL_ENERGY = 3;

  // Restore parasympathetic tone after a spike. Short, and effective in one or
  // two cycles rather than over a timed session.
  TECHNIQUE_GOAL_RESET = 4;

  // Hold attention on something deliberate. Longer holds and side-to-side
  // patterns, where the counting is as much the point as the breathing.
  TECHNIQUE_GOAL_FOCUS = 5;
}

// One segment of a breathing cycle.
enum PhaseKind {
  PHASE_KIND_UNSPECIFIED = 0;

  PHASE_KIND_INHALE = 1;

  // Hold with the lungs full.
  PHASE_KIND_HOLD_IN = 2;

  PHASE_KIND_EXHALE = 3;

  // Hold with the lungs empty. Distinct from HOLD_IN because it feels
  // materially different to the practitioner and the UI cues it differently.
  PHASE_KIND_HOLD_OUT = 4;
}

// A single segment of the cycle, held in the order the client should play it.
message Phase {
  PhaseKind kind = 1;

  // Milliseconds, not seconds: the physiological sigh's second inhale is a
  // sub-second beat, and an integer count of seconds cannot express it.
  //
  // The curated default. Always within [min_duration_ms, max_duration_ms].
  uint32 duration_ms = 2;

  // The evidence-based range this phase may be dialled within, inclusive.
  //
  // Carried as data so that every client renders its Advanced dials from the
  // catalogue rather than hardcoding limits it would then have to keep in step
  // with the seed. A phase whose range is a single point is not adjustable —
  // an open-ended retention has no dial at all, because the person ends it.
  uint32 min_duration_ms = 3;
  uint32 max_duration_ms = 4;
}

// A run of cycles sharing one phase pattern.
//
// The general case a plain cyclic technique degenerates to: box breathing is
// one stage of eight cycles, while a Wim Hof-style round is three stages —
// fast breaths, a retention the person ends, then a recovery hold.
message Stage {
  // The pattern, in play order. Never empty.
  repeated Phase phases = 1;

  // How many times this stage repeats its pattern before the next stage
  // begins. Always at least one.
  uint32 cycles = 2;

  // Whether the person, rather than the clock, decides when this stage is
  // over — a retention hold in a Wim Hof-style round. A client shows a "tap
  // when you're ready" affordance instead of a countdown, and its phases'
  // durations describe a typical hold rather than a scheduled one.
  bool open_ended = 3;
}

// A breathing technique and the session it describes.
message Technique {
  string id = 1;

  // Stable, human-readable key ("box-breathing"). The client pins its built-in
  // artwork and haptic patterns to this rather than to `id`, so the catalogue
  // can be reseeded without the app losing track of what it is looking at.
  string slug = 2;

  string name = 3;

  // One or two sentences: what it does and when to reach for it.
  string summary = 4;

  TechniqueGoal goal = 5;

  // M1's `phases` and `recommended_cycles`, replaced by the stage model in M2
  // while no client had shipped. Reserved rather than reused so a development
  // build holding the old contract fails to decode rather than misreading a
  // stage list as a phase list.
  reserved 6, 7;
  reserved "phases", "recommended_cycles";

  // The session, in play order. Never empty.
  repeated Stage stages = 8;

  // How many times a session repeats the whole stage list by default — curated
  // per technique. One for everything cyclic; three for a Wim Hof-style round,
  // where the round is the unit the protocol is counted in. Always at least
  // one. A user's own preference is a client-side override until identity
  // exists to store it against.
  uint32 recommended_rounds = 9;

  // The caution this technique carries, or empty where it carries none.
  //
  // Separate from `summary` because it has to reach the person who is already
  // breathing: a client shows the summary when choosing and this while doing.
  string safety_note = 10;
}

// One question a beginner has, and the app's answer to it.
message FoundationTopic {
  // Stable key ("nose-or-mouth"), so a client — or M6's assistant, citing the
  // same rows — can reference a topic without pinning its wording.
  string slug = 1;

  // Phrased as the question someone actually asks, not as a heading.
  string question = 2;

  // A short answer, framed as a suggestion. Never a rule: the breathing works
  // while you are still learning.
  string answer = 3;
}

message ListTechniquesRequest {}

message ListTechniquesResponse {
  // Ordered for display, not by id — the sequence is curated so the catalogue
  // opens on the techniques a newcomer should try first.
  repeated Technique techniques = 1;
}

message ListFoundationsRequest {}

message ListFoundationsResponse {
  // Ordered for display: the questions come in the order they occur to someone
  // learning, not alphabetically.
  repeated FoundationTopic topics = 1;
}
